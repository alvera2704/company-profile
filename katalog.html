
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog - Alvéra</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .catalog-page {
            max-width: 1100px;
            width: 92%;
            margin: 50px auto;
            text-align: center;
        }

        .catalog-page h1 {
            color: #a85e43;
            font-size: 38px;
            margin-bottom: 10px;
        }

        .catalog-page p {
            color: #777;
            margin-bottom: 30px;
        }

        .catalog-artwork img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000015;
        }

        .catalog-artwork {
            margin: 0;
        }

        .catalog-artwork figcaption {
            margin-top: 15px;
            color: #a85e43;
        }

        .back-home {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background: #a85e43;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        @media(max-width: 600px) {
            .catalog-page h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="catalog.html">Katalog</a>
        </nav>
    </header>

    <main class="catalog-page">

        <h1>Our Catalog</h1>

        <p>
            Discover our lovely cat birthday parties
            and playful cat toys!
        </p>

        <figure class="catalog-artwork">

          alvera-cat\assets\alvera-katalog.png
            <figcaption>
                Alvéra - Celebrate Their Happiness With Love.
            </figcaption>

        </figure>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>
